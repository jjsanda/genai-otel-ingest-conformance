apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: genai-conformance

resources:
  - ../../base

patches:
  # Faster exporter flush in the e2e cluster so the report settles quickly
  # after the traffic Job completes (well inside the gateway's 10s idle
  # window either way).
  - target:
      kind: Deployment
      name: agent-demo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_BSP_SCHEDULE_DELAY, value: "1000"}
  - target:
      kind: Deployment
      name: agent-demo-noncompliant
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_BSP_SCHEDULE_DELAY, value: "1000"}
