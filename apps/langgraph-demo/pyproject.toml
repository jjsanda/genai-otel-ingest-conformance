[project]
name = "langgraph-demo"
version = "0.1.0"
description = "LangGraph agent bridged to the OpenTelemetry GenAI semantic conventions via a custom callback handler"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.7",
    "langchain-core==1.4.8",
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
]

[project.optional-dependencies]
# Real providers are opt-in: the demo is deterministic and key-free by default.
real = [
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
