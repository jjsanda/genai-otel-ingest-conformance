version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Writes to the CLI's own stdout/stderr: failure is neither actionable
      # nor recoverable, and checking each call is pure noise.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
