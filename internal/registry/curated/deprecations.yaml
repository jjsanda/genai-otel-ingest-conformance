# Deprecated and legacy GenAI telemetry shapes, with migration targets.
#
# The attribute renames were made in the main semantic-conventions repository
# (which has since deprecated its entire gen_ai.* namespace in favor of the
# dedicated GenAI repository). Instrumentations migrate via
# OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental.
deprecated_attributes:
  gen_ai.system:
    replacement: gen_ai.provider.name
    note: Renamed when the provider discriminator was reworked (semconv v1.36 transition).
  gen_ai.usage.prompt_tokens:
    replacement: gen_ai.usage.input_tokens
    note: Renamed for consistency across providers.
  gen_ai.usage.completion_tokens:
    replacement: gen_ai.usage.output_tokens
    note: Renamed for consistency across providers.
  gen_ai.prompt:
    replacement: gen_ai.input.messages
    note: Content capture moved to structured opt-in span attributes.
  gen_ai.completion:
    replacement: gen_ai.output.messages
    note: Content capture moved to structured opt-in span attributes.
  gen_ai.openai.request.seed:
    replacement: gen_ai.request.seed
    note: Promoted from the OpenAI namespace to the shared namespace.
  gen_ai.openai.request.response_format:
    replacement: gen_ai.output.type
    note: Generalized across providers.

# Legacy span-event style content capture, replaced by the opt-in
# gen_ai.input.messages / gen_ai.output.messages span attributes.
deprecated_events:
  gen_ai.content.prompt: {replacement: gen_ai.input.messages}
  gen_ai.content.completion: {replacement: gen_ai.output.messages}
  gen_ai.system.message: {replacement: gen_ai.input.messages}
  gen_ai.user.message: {replacement: gen_ai.input.messages}
  gen_ai.assistant.message: {replacement: gen_ai.output.messages}
  gen_ai.tool.message: {replacement: gen_ai.input.messages}
  gen_ai.choice: {replacement: gen_ai.output.messages}
