# One-command demo: docker compose up -d --build
#
# Topology (deliberate — see the README):
#   agent-demo ──OTLP──▶ collector (remediation, batching) ──OTLP──▶ gateway
#   agent-demo-noncompliant ──OTLP (direct, unfiltered) ────────────▶ gateway
#
# The compliant app takes the production-shaped path through a collector;
# the noncompliant app ships straight to the gateway so nothing can paper
# over its violations. Watch them side by side at http://localhost:8080.
name: genai-otel-ingest-conformance

services:
  gateway:
    build:
      context: .
      args: {VERSION: compose}
    image: genai-conformance:local
    # Default windowing (10s idle): SDK batch processors flush every ~5s,
    # so a tighter window would judge traces before their root spans arrive
    # (visible as GENAI-TRACE-005 late-arrival findings — try it).
    command: ["serve"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080" # report UI, /api/report, /metrics
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC (host access for local experiments)
      - "${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    depends_on:
      - gateway
    restart: unless-stopped

  agent-demo:
    build: apps/agent-demo
    image: genai-agent-demo:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    ports:
      - "${DEMO_PORT:-8000}:8000"
    depends_on:
      - collector
    restart: unless-stopped

  agent-demo-noncompliant:
    image: genai-agent-demo:local
    build: apps/agent-demo
    environment:
      # Bypasses the collector on purpose: the gateway must judge the raw
      # application output, not the pipeline's cleaned-up version.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://gateway:4318
      DEMO_NONCOMPLIANT: "1"
    ports:
      - "${DEMO_BROKEN_PORT:-8001}:8000"
    depends_on:
      - gateway
    restart: unless-stopped

  langgraph-demo:
    build: apps/langgraph-demo
    image: genai-langgraph-demo:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    # The LangGraph demo is a batch runner, not a server: replay its
    # built-in questions on a slow loop so the bridge keeps producing
    # fresh framework telemetry.
    command:
      - sh
      - -c
      - |
        sleep 10
        while true; do python -m langgraph_demo.main; sleep 45; done
    depends_on:
      - collector
    restart: unless-stopped

  traffic:
    image: genai-agent-demo:local
    build: apps/agent-demo
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    command:
      - sh
      - -c
      - |
        sleep 8
        python scripts/traffic.py --endpoint http://agent-demo:8000 --conversations 3 --loop &
        python scripts/traffic.py --endpoint http://agent-demo-noncompliant:8000 --conversations 1 --pace 3 --loop &
        wait
    depends_on:
      - agent-demo
      - agent-demo-noncompliant
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/genai-conformance.json
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
