name: e2e-kind

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "42 5 * * 1" # Mondays 05:42 UTC — catches image/base drift

permissions:
  contents: read

jobs:
  e2e:
    name: Full stack in kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run the end-to-end suite
        run: hack/e2e-kind.sh
